name: Update RustCFML

# Keeps the `cfml-worker` dependency on the engine's current STABLE release: it
# bumps Cargo.toml, proves the worker still compiles for wasm32, and commits
# straight to main.
#
# Two things it deliberately does NOT do any more, because between them they
# turned this from automation into a chore:
#
#   * It no longer follows every upstream TAG. RustCFML publishes every version
#     tag as a prerelease and a human promotes one to stable once it has been
#     run in anger (see the engine's docs/releasing.md), so following tags meant
#     a bump for every patch release — a dozen in two days — most of which
#     nobody wanted yet. `gh release view` resolves to the promoted one.
#   * It no longer opens a pull request. One PR per release, each superseding
#     the last and none of them merged, is how this repo ended up with six open
#     PRs and a dependency six versions behind. The build gate is what makes a
#     PR unnecessary: the wasm32 build must pass against the new engine before
#     anything is committed, and if it fails the run fails and main is untouched.
#     Any superseded PRs left over are closed automatically.
#
# Mechanism: scheduled poll (no changes or access required in the RustCFML repo).
# You can also trigger it by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    # Poll once per hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: RustCFML/RustCFML

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use GH_PAT if set (needed when the org blocks GITHUB_TOKEN from
          # opening PRs); otherwise fall back to the built-in token. This token
          # is what `git push` will authenticate with.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Determine current and latest RustCFML versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Tag currently pinned in Cargo.toml, e.g. tag = "v0.380.0"
          current="$(grep -oP 'cfml-worker\s*=.*tag\s*=\s*"\K[^"]+' Cargo.toml)"
          echo "Current: $current"

          # The engine's current STABLE release — GitHub's "latest release"
          # endpoint, which excludes prereleases, and every RustCFML tag is
          # published as a prerelease until a human promotes it. Following tags
          # instead would bump this worker for every patch release.
          latest="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName --jq .tagName)"
          echo "Latest stable: $latest"

          if [ -z "$latest" ]; then
            echo "Could not resolve a stable release from ${UPSTREAM_REPO}." >&2
            exit 1
          fi

          {
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

          # Only proceed if `latest` is strictly newer than `current`.
          if [ "$current" = "$latest" ] || \
             [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" != "$latest" ]; then
            echo "Already on the latest version ($current). Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust (wasm32 target)
        if: steps.versions.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.versions.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Bump dependency and verify build
        if: steps.versions.outputs.changed == 'true'
        run: |
          set -euo pipefail
          current="${{ steps.versions.outputs.current }}"
          latest="${{ steps.versions.outputs.latest }}"

          # Update the tag in Cargo.toml and refresh Cargo.lock to the exact tag.
          sed -i "s|tag = \"${current}\"|tag = \"${latest}\"|" Cargo.toml
          # Prove the edit landed rather than trusting sed's exit status: a
          # pattern that matches nothing exits 0, and the run would then commit
          # a "bump" that never happened and a build that proved nothing.
          grep -q "tag = \"${latest}\"" Cargo.toml \
            || { echo "::error::Cargo.toml still does not pin ${latest} after the edit"; exit 1; }
          cargo update -p cfml-worker --precise "${latest}"

          # Fail the run — and leave main untouched — if the new engine does not
          # compile. This gate is what makes committing without review safe.
          cargo build --release --target wasm32-unknown-unknown

      - name: Commit to main
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Upgrade cfml-worker to RustCFML ${LATEST} (was ${CURRENT})

          The engine's ${LATEST} was promoted to stable upstream. Compiled for
          wasm32-unknown-unknown in CI before this was committed."
          git push origin "HEAD:${{ github.ref_name }}"

          # Anything this workflow opened before it committed directly is now
          # superseded — and a stack of those is exactly how the dependency got
          # six versions behind.
          for n in $(gh pr list --state open --search "head:deps/rustcfml-" --json number --jq '.[].number'); do
            gh pr close "$n" --comment "Superseded: the dependency is now on \`${LATEST}\` on main." --delete-branch || true
          done

          {
            echo "### Upgraded to RustCFML \`${LATEST}\`"
            echo
            echo "From \`${CURRENT}\`. The wasm32 build passed against the new engine"
            echo "before this was committed to \`${{ github.ref_name }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
